name: QA
on:
  push:
    branches: [main]
  pull_request:
# Per-ref group: a new push to the same branch/PR cancels the previous
# in-flight run; runs on different refs proceed in parallel.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Run test suite
        # test_assignment_benchmark.py / test_assignment_batched_benchmark.py
        # are excluded: they carry their own @pytest.mark.timeout(120) across
        # many parametrized solver x dataset cases (--benchmark-disable only
        # skips repeated timing rounds, not the underlying solver calls), and
        # on a GPU-less CI runner the CPU-only auction solver can land on
        # inputs that converge very slowly at its default bid size. CLAUDE.md
        # already documents these as `just bench`-only, not `just test`.
        run: >
          uv run pytest -n auto --dist=loadfile --benchmark-disable --ignore=tests/unitrack/assignment/test_assignment_benchmark.py --ignore=tests/unitrack/assignment/test_assignment_batched_benchmark.py

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install lint tooling
        run: uv sync --only-group dev
      - name: Ruff check
        run: uv run ruff check .
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync
      - name: Pyright
        run: uv run pyright
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.DOCYARD_PAT }}
      # Builds the treefmt (ruff/clang-format/alejandra/yamlfmt/taplo/...)
      # and pre-commit-hooks checks defined in flake.nix, so formatting is
      # enforced through the same treefmt-nix setup used across projects
      # rather than a separately maintained CI-only invocation. Deliberately
      # narrower than `nix flake check`: the full flake check also evaluates
      # devShells, which pull in the private `tue-p8n/nix` input and need
      # broader repo access than this workflow's token grants.
      - name: Build treefmt and pre-commit checks
        run: nix build -L .#checks.x86_64-linux.treefmt .#checks.x86_64-linux.pre-commit
