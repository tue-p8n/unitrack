name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Diagnose hang
        timeout-minutes: 5
        run: |
          pip install --quiet py-spy
          PYSPY=$(command -v py-spy)
          uv run pytest -n auto --dist=loadfile --benchmark-disable &
          PYTEST_PID=$!
          sleep 60
          echo "=== high-CPU worker PIDs ==="
          ps -eo pid,pcpu,cmd --sort=-pcpu | head -10
          for pid in $(pgrep -f "exec\(eval\(sys.stdin.readline"); do
            echo "=== py-spy dump PID $pid (native + python stacks) ==="
            sudo "$PYSPY" dump --pid "$pid" --native --locals || true
          done
          kill -9 "$PYTEST_PID" 2>/dev/null || true
          pkill -9 -f pytest 2>/dev/null || true

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/unitrack/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
