name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run test suite
        # test_assignment_benchmark.py / test_assignment_batched_benchmark.py
        # are excluded: they carry their own @pytest.mark.timeout(120) across
        # many parametrized solver x dataset cases (--benchmark-disable only
        # skips repeated timing rounds, not the underlying solver calls), and
        # on a GPU-less CI runner the CPU-only auction solver can land on
        # inputs that converge very slowly at its default bid size. CLAUDE.md
        # already documents these as `just bench`-only, not `just test`.
        run: >
          uv run pytest -n auto --dist=loadfile --benchmark-disable
          --ignore=tests/unitrack/assignment/test_assignment_benchmark.py
          --ignore=tests/unitrack/assignment/test_assignment_batched_benchmark.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/unitrack/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
