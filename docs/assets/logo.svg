<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90" role="img" aria-label="unitrack logo">
  <title>unitrack</title>

  <!-- Icon panel -->
  <rect x="4" y="4" width="82" height="82" rx="14" fill="#F0F7FF" stroke="#C3D9FF" stroke-width="1.5"/>

  <!-- ── TRACK 3 · TEAL ── drawn first (background at crossings) -->
  <path d="M 18,43 C 36,38 54,48 72,43"
        stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="18" cy="43" r="2.5" fill="#34D399" opacity="0.2"/>
  <circle cx="35" cy="40" r="3.5" fill="#34D399" opacity="0.45"/>
  <circle cx="55" cy="46" r="3.5" fill="#34D399" opacity="0.45"/>
  <circle cx="72" cy="43" r="5.5" fill="#34D399"/>
  <rect x="64.5" y="35.5" width="15" height="15" rx="2"
        fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.35"/>

  <!-- ── TRACK 2 · BLUE ── drawn second -->
  <path d="M 18,70 C 40,70 50,16 72,16"
        stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="18" cy="70" r="2.5" fill="#60A5FA" opacity="0.2"/>
  <circle cx="37" cy="56" r="3.5" fill="#60A5FA" opacity="0.45"/>
  <circle cx="53" cy="30" r="3.5" fill="#60A5FA" opacity="0.45"/>
  <circle cx="72" cy="16" r="5.5" fill="#60A5FA"/>
  <rect x="64.5" y="8.5" width="15" height="15" rx="2"
        fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.35"/>

  <!-- ── TRACK 1 · CORAL ── drawn last (foreground at crossing) -->
  <path d="M 18,16 C 40,16 50,70 72,70"
        stroke="#F87171" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="18" cy="16" r="2.5" fill="#F87171" opacity="0.2"/>
  <circle cx="37" cy="30" r="3.5" fill="#F87171" opacity="0.45"/>
  <circle cx="53" cy="56" r="3.5" fill="#F87171" opacity="0.45"/>
  <circle cx="72" cy="70" r="5.5" fill="#F87171"/>
  <rect x="64.5" y="62.5" width="15" height="15" rx="2"
        fill="none" stroke="#F87171" stroke-width="1.5" opacity="0.35"/>

  <!-- Wordmark -->
  <text x="104" y="58"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace"
        font-size="40"
        font-weight="700"
        fill="#0F172A"
        letter-spacing="-0.5">unitrack</text>
</svg>
