[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "unitrack"
description = "PyTorch library for multi-object tracking (MOT) and data association."
readme = "README.md"
version = "2.0.1"
requires-python = ">=3.13, <3.14"
keywords = [
  "computer vision",
  "multi-object tracking",
  "mot",
  "object tracking",
  "pytorch",
  "data association",
  "bipartite matching",
]
authors = [{ name = "Kurt Stolle", email = "kurt@computer.org" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.7",
  "torchvision",
  "scipy>=1.10.0",
  "numpy>=2.0.0",
  "tensordict>=0.11.0",
  "torchmatch>=1.0.1",
]

[project.optional-dependencies]
bench = []
hpo = ["optuna"]
# The benchmark harness also needs the `evaluators` package for the HOTA
# metric. It is not distributed as part of this project, so it is NOT declared
# here (a path source would break CI); install it on demand, e.g.
# `uv pip install -e /path/to/evaluators`. The harness imports it lazily and
# the tests `importorskip` it, so the package degrades gracefully when absent.
benchmark = [
  "transformers>=4.46.0",
  "huggingface-hub>=0.25.0",
  "pillow>=10.0.0",
  "lmdb>=1.4.0",
  "safetensors>=0.4.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.140.2",
  "nbstripout>=0.9.0",
  "prek",
  "pytest>=8.4.2",
  "pytest-benchmark>=5.1.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest-runner>=6.0.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.9.0",
  "ipdb>=0.13.13",
  "ty>=0.0.17",
  "pytest-timeout>=2.4.0",
]
notebooks = [
  "ipykernel>=6.30.1",
  "ipywidgets>=8.1.7",
  "jupyterlab>=4.4.9",
  "matplotlib>=3.8",
]
# Dependencies for the runnable examples under examples/. Mirrors the published
# `hpo` extra so the synthetic HPO sweep runs in the devshell; PyPI consumers
# instead use `pip install 'unitrack[hpo]'`.
examples = ["optuna"]

[tool.ruff]
target-version = 'py313'
line-length = 88

[tool.ruff.lint]
select = [
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C",   # mccabe
  "C4",  # flake8-comprehensions
  #"DOC",  # doclint
  "D",    # pydocstyle
  "E",    # pycodestyle
  "EM",   # flake8-errmsg
  "F",    # pyflakes
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "N",    # pep8-naming
  "NPY",  # NumPy specific rules
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "RUF",  # Ruff-specific rules
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TRY",  # Tryceratops
  "UP",   # pyupgrade
]
ignore = [
  "PLR2004", # magic numbers
  "PLW2901", # for loop variable overwritten
  "D212",
  "D203",
  "D107",    # docstring on __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "T", "PLC0415", "PLR1714"]
"sources/unitrack/__init__.py" = ["PLC0415"]
"sources/unitrack/assignment/_hungarian.py" = ["PLC0415"]
# The benchmark harness imports its optional `benchmark`-extra deps
# (lmdb/PIL/transformers/evaluators) lazily so the package degrades gracefully
# when the extra is absent.
"sources/unitrack/benchmarks/hota/*.py" = ["PLC0415"]
"docs/5.notebooks/tutorials/_build.py" = [
  "D",
  "T",
  "E501",
  "RUF001",
  "RUF003",
  "PLR0915",
]
"docs/5.notebooks/embedding_filters/_build.py" = [
  "D",
  "T",
  "E501",
  "RUF001",
  "RUF003",
  "PLR0915",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.uv]
# The Nix devshell (and a bare `uv sync`) provisions these groups by default so
# the environment can run the full developer surface out of the box: the test
# suite (dev), the tutorial notebooks (notebooks), and the HPO example
# (examples -> optuna). The documentation site is built by docyard (see
# flake.nix), not from a uv dependency group. The real-data HPO path
# additionally needs `transformers` and `pillow`; install those on demand
# (see examples/hpo_sweep/README.md) to avoid pulling heavy weights by default.
default-groups = ["dev", "notebooks", "examples"]
# torchmatch uses torch at build time; disable isolation so it sees
# the venv's pinned torch rather than pulling a fresh copy from PyPI.
no-build-isolation-package = ["torchmatch"]


[tool.uv.build-backend]
module-root = "sources"
module-name = ["unitrack"]
namespace = true

[tool.ty.environment]
root = ["./sources"]

[tool.ty.src]
include = ["sources", "tests", "docs/5.notebooks", "scripts"]

[tool.pytest.ini_options]
timeout = 10
